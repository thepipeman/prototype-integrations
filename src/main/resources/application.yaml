spring:
  application:
    name: prototype-integrations
  threads:
    virtual:
      enabled: true

# Transport settings of the demo's own RestClient beans (see DemoClientsConfiguration). Placeholder localhost URLs:
# the app starts without the downstreams running.
demo:
  clients:
    profile-service:
      base-url: http://localhost:9101
      connect-timeout: 500ms
      read-timeout: 2s
    verification-service:
      base-url: http://localhost:9102
      connect-timeout: 500ms
      read-timeout: 3s
    account-service:
      base-url: http://localhost:9103
      connect-timeout: 500ms
      read-timeout: 3s
    notification-service:
      base-url: http://localhost:9104
      connect-timeout: 500ms
      read-timeout: 2s
      default-header:
        Efs-Product-Id: prototype-integrations
  notification:
    api-key: placeholder-not-a-secret

# The RestClient beans to protect. The client name is also the breaker name and the "dependency" in logs and metrics;
# breaker tuning is under resilience4j.circuitbreaker.instances.<name> below.
resilient-client:
  clients:
    profile-service:
      bean: profileRestClient
      error-handling:
        enabled: true
    verification-service:
      bean: verificationRestClient
      error-handling:
        enabled: true
    account-service:
      bean: accountRestClient
      error-handling:
        enabled: true
    notification-service:
      bean: notificationRestClient
      error-handling:
        enabled: true
      policy:
        # A 409 means "duplicate submission, already accepted" and carries a normal receipt. Rejected credentials
        # count as breaker failures: a non-critical dependency with broken auth should stop being called.
        count-rejected-as-failure: true
        status-overrides:
          409: success

resilience4j:
  circuitbreaker:
    # The FailureClassifier is the only authority on outcomes: never set recordExceptions,
    # ignoreExceptions or recordResult here.
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: false
        registerHealthIndicator: true
        # An open downstream must not take our own health (and liveness) down.
        allowHealthIndicatorToFail: false
    instances:
      account-service:
        baseConfig: default
        slowCallDurationThreshold: 1s
        slowCallRateThreshold: 50
      notification-service:
        baseConfig: default
        failureRateThreshold: 75

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
